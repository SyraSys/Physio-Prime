name: physio_prime_app
description: "PhysioPrime Patient Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1

  # State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Network & Authentication
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  supabase_flutter: ^2.8.3
  flutter_secure_storage: ^9.2.2

  # Location, Payments & Utilities
  geolocator: ^13.0.2
  razorpay_flutter: ^1.3.7
  intl: ^0.19.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
