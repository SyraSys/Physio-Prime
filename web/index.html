<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="PhysioPrime - Elite Physiotherapy at Home & Online. Book verified clinical specialists.">
  <meta name="theme-color" content="#F6FBF9">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PhysioPrime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PhysioPrime</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #F6FBF9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #app-loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #F6FBF9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.35s ease-out, visibility 0.35s ease-out;
    }

    #app-loading-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }

    .logo-container {
      width: 92px;
      height: 92px;
      background: #FFFFFF;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid #E2EFEA;
      box-shadow: 0 8px 24px rgba(8, 145, 178, 0.12);
      margin-bottom: 20px;
    }

    .logo-img {
      width: 56px;
      height: 56px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -0.6px;
      color: #0F172A;
    }

    .brand-title span {
      color: #0891B2;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.96);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <!-- Minimalist Brand Loading Screen (Logo and Name only) -->
  <div id="app-loading-screen">
    <div class="loading-content">
      <div class="logo-container">
        <img class="logo-img" src="logo.png" alt="PhysioPrime Logo" />
      </div>
      <h1 class="brand-title">Physio<span>Prime</span></h1>
    </div>
  </div>

  <script>
    function removeWebLoader() {
      const loader = document.getElementById('app-loading-screen');
      if (loader && !loader.classList.contains('fade-out')) {
        loader.classList.add('fade-out');
        setTimeout(function () {
          if (loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 400);
      }
    }

    // Dismiss when Flutter renders its first frame
    window.addEventListener('flutter-first-frame', removeWebLoader);

    // Fallback: dismiss when Flutter view appears in DOM
    const flutterViewObserver = new MutationObserver(function (mutations, observer) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        setTimeout(removeWebLoader, 300);
        observer.disconnect();
      }
    });
    flutterViewObserver.observe(document.body, { childList: true, subtree: true });

    // Absolute fallback safety timeout (8 seconds)
    setTimeout(removeWebLoader, 8000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
